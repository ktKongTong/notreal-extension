name: Worker

on:
  push:
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      KV_NAMESPACE_ID: ${{ secrets.NOTREAL_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.KV_NAMESPACE_ID != '' }}
        run: |
          node -e "const fs=require('node:fs');const p='wrangler.jsonc';fs.writeFileSync(p,fs.readFileSync(p,'utf8').replace('00000000000000000000000000000000',process.env.KV_NAMESPACE_ID))"
          npm run deploy
